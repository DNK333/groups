<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Django Sessions</title>
</head>
<body>

    {% if username %}
        <h1>Привет, {{ username }}!</h1>
        <p>Я помню тебя!</p>

        <form action="{% url 'forget' %}" method="POST">
            {% csrf_token %}
            <button type="submit">Забыть меня</button>
        </form>

    {% else %}
        <h1>Привет, незнакомец!</h1>

        <form method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="name"
                placeholder="Введи своё имя"
                required
            >

            <button type="submit">Запомнить меня</button>
        </form>
    {% endif %}

</body>
</html>
